version: "3.8"
services:
  psb-saza:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psb-saza
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - psb-storage:/var/www/storage/app
      - psb-cache:/var/www/bootstrap/cache
    environment:
      APP_NAME: ${APP_NAME:-PSB SAZA}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: psb-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-psb_saza}
      DB_USERNAME: ${DB_USERNAME:-psb_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    networks:
      - psb-network
      - dokploy-network
      - default
    depends_on:
      psb-db:
        condition: service_healthy
    labels:
      - traefik.http.routers.psb-saza-psb-hgom48-5-web.rule=Host(`psb.saza.sch.id`)
      - traefik.http.routers.psb-saza-psb-hgom48-5-web.entrypoints=web
      - traefik.http.services.psb-saza-psb-hgom48-5-web.loadbalancer.server.port=80
      - traefik.http.routers.psb-saza-psb-hgom48-5-web.service=psb-saza-psb-hgom48-5-web
      - traefik.http.routers.psb-saza-psb-hgom48-5-web.middlewares=redirect-to-https@file
      - traefik.http.routers.psb-saza-psb-hgom48-5-websecure.rule=Host(`psb.saza.sch.id`)
      - traefik.http.routers.psb-saza-psb-hgom48-5-websecure.entrypoints=websecure
      - traefik.http.services.psb-saza-psb-hgom48-5-websecure.loadbalancer.server.port=80
      - traefik.http.routers.psb-saza-psb-hgom48-5-websecure.service=psb-saza-psb-hgom48-5-websecure
      - traefik.http.routers.psb-saza-psb-hgom48-5-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.psb-saza-psb-hgom48-5-web.rule=Host(`psb.saza.sch.id`)
      - traefik.http.routers.psb-saza-psb-hgom48-5-web.entrypoints=web
      - traefik.http.services.psb-saza-psb-hgom48-5-web.loadbalancer.server.port=80
      - traefik.http.routers.psb-saza-psb-hgom48-5-web.service=psb-saza-psb-hgom48-5-web
      - traefik.http.routers.psb-saza-psb-hgom48-5-web.middlewares=redirect-to-https@file
      - traefik.http.routers.psb-saza-psb-hgom48-5-websecure.rule=Host(`psb.saza.sch.id`)
      - traefik.http.routers.psb-saza-psb-hgom48-5-websecure.entrypoints=websecure
      - traefik.http.services.psb-saza-psb-hgom48-5-websecure.loadbalancer.server.port=80
      - traefik.http.routers.psb-saza-psb-hgom48-5-websecure.service=psb-saza-psb-hgom48-5-websecure
      - traefik.http.routers.psb-saza-psb-hgom48-5-websecure.tls.certresolver=letsencrypt
      - traefik.docker.network=dokploy-network
      - traefik.enable=true
  psb-db:
    image: mysql:8.0
    container_name: psb-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-psb_saza}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_USER: ${DB_USERNAME:-psb_user}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - psb-network
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p${DB_ROOT_PASSWORD:-rootchangeme}
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  dbdata:
    driver: local
  psb-storage:
    driver: local
  psb-cache:
    driver: local
networks:
  psb-network:
    driver: bridge
  dokploy-network:
    external: true
