version: '3.8'

services:
  psb-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psb-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - psb-network
    depends_on:
      - psb-db

  psb-db:
    image: mysql:8.0
    container_name: psb-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: psb_saza
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: psb_user
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - psb-network

volumes:
  dbdata:
    driver: local

networks:
  psb-network:
    driver: bridge