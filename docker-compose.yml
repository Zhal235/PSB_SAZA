version: '3.8'

services:
  psb-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psb-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "80:80"
    volumes:
      - psb-storage:/var/www/storage/app
      - psb-cache:/var/www/bootstrap/cache
    environment:
      APP_NAME: ${APP_NAME:-PSB SAZA}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: psb-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-psb_saza}
      DB_USERNAME: ${DB_USERNAME:-psb_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
    networks:
      - psb-network
    depends_on:
      psb-db:
        condition: service_healthy

  psb-db:
    image: mysql:8.0
    container_name: psb-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-psb_saza}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_USER: ${DB_USERNAME:-psb_user}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - psb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootchangeme}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
    driver: local
  psb-storage:
    driver: local
  psb-cache:
    driver: local

networks:
  psb-network:
    driver: bridge
    driver: bridge